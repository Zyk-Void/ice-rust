# icers — a Rust agent runtime + CLI. See README.md and docs/architecture/overview.md.
[workspace]
members = [
    "crates/ice-telemetry",
    "crates/ice-ai",
    "crates/ice-agent",
    "crates/ice-tools",
    "crates/ice-harness",
    "crates/ice-cli",
    "crates/ice-tui",
    "crates/ice-plugin-sdk",
    "crates/ice-extensions",
    "examples/minimal",
    "examples/tools",
    "examples/tui",
    "examples/plugin-stub",
]
default-members = [
    "crates/ice-agent",
    "crates/ice-tools",
    "crates/ice-harness",
    "crates/ice-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/Zyk-Void/ice-rust"
homepage = "https://rpi.laofu.online/"
version = "0.6.1"
authors = ["BigFish <fuwei201473@gmail.com>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "process", "sync", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"
fs2 = "0.4"

# Serialization / schemas
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
yaml_serde = "=0.10.2"
indexmap = { version = "2", features = ["serde"] }
schemars = { version = "0.8", features = ["preserve_order"] }
jsonschema = "0.18"

# HTTP / SSE (used by anthropic provider, M3)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
bytes = "1"
eventsource-stream = "0.2"

# Errors / logging
thiserror = "1"
tracing = "0.1"

# Misc
uuid = { version = "1", features = ["v4", "v7"] }
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
png = "0.18"
tempfile = "3"
regex = "1"
semver = "1"
globset = "=0.4.15"
dirs = "5"
rpassword = "7"

# icers internal crates (package names and directories both use the `ice-` prefix).
ice-telemetry = { path = "crates/ice-telemetry", version = "0.6.1" }
ice-ai = { path = "crates/ice-ai", version = "0.6.1" }
ice-agent = { path = "crates/ice-agent", version = "0.6.1" }
ice-tools = { path = "crates/ice-tools", version = "0.6.1" }
ice-harness = { path = "crates/ice-harness", version = "0.6.1" }

ice-tui = { path = "crates/ice-tui", version = "0.6.1" }

ice-plugin-sdk = { path = "crates/ice-plugin-sdk", version = "0.6.1" }
ice-extensions = { path = "crates/ice-extensions", version = "0.6.1" }

[profile.release]
lto = "thin"
codegen-units = 16
strip = "symbols"
