<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>icers observe</title>
<style>
/* Layout: a flight recorder. Instrument tiles up top, the activity pulse as a
   strip chart, then the event tape with a forensic inspector docked right.
   Fonts are system faces on purpose: the page must work offline and must never
   request a third-party host with the token-bearing URL as referrer. */
:root {
  --bg: #f3f5f8;          /* page plane, faint blue bias */
  --surface: #fbfcfd;     /* panels and chart surface */
  --surface-2: #eceff4;   /* hover wash, code blocks */
  --ink: #14171c;
  --ink-2: #4a5160;
  --muted: #737b8a;
  --line: #dde2e9;
  --baseline: #c3c9d3;
  --accent: #2a64c8;      /* interactive: focus, selection, links */
  --accent-wash: #e3ecfb;
  /* status (reserved, always with icon + label) */
  --good: #0ca30c; --good-ink: #006300;
  --warning: #fab219; --warning-ink: #8a5a00;
  --critical: #d03b3b; --critical-ink: #b02c2c; --critical-wash: #fbeaea;
  --add-wash: #e5f4e8; --del-wash: #fbe8e8;
  /* categorical: thread identity, validated palette (fixed order) */
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --series-5: #e87ba4; --series-6: #008300; --series-7: #6250d6; --series-other: #8a92a1;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --radius: 8px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1013; --surface: #15171b; --surface-2: #1d2026; --ink: #eceef2; --ink-2: #b7bdc8;
    --muted: #868d9a; --line: #2a2e36; --baseline: #3a3f49; --accent: #78a3f2; --accent-wash: #1d2a44;
    --good-ink: #3fc23f; --warning-ink: #f5c04a; --critical-ink: #f07d7d; --critical-wash: #3a1b1d;
    --add-wash: #16301f; --del-wash: #3a1d20;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-other: #6d7482;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1013; --surface: #15171b; --surface-2: #1d2026; --ink: #eceef2; --ink-2: #b7bdc8;
  --muted: #868d9a; --line: #2a2e36; --baseline: #3a3f49; --accent: #78a3f2; --accent-wash: #1d2a44;
  --good-ink: #3fc23f; --warning-ink: #f5c04a; --critical-ink: #f07d7d; --critical-wash: #3a1b1d;
  --add-wash: #16301f; --del-wash: #3a1d20;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-other: #6d7482;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); display: flex; flex-direction: column; overflow: hidden; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
button { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { border-color: var(--baseline); background: var(--surface-2); }
.label { color: var(--muted); font-size: 11px; letter-spacing: .04em; text-transform: uppercase; }

/* ---------- instrument header ---------- */
.top { background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 12px 28px; align-items: center; }
.brand { display: flex; flex-direction: column; gap: 1px; min-width: 0; margin-right: 4px; }
.brand b { font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
.brand span { color: var(--muted); font: 11px var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }
.tiles { display: flex; flex-wrap: wrap; gap: 10px 26px; flex: 1; min-width: 0; }
.tile { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tile .value { font-size: 15px; font-weight: 600; white-space: nowrap; }
.tile .sub { color: var(--muted); font-size: 11px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.meter { width: 108px; height: 6px; border-radius: 3px; background: var(--accent-wash); overflow: hidden; margin-top: 2px; }
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--series-1); transition: width .3s; }
.meter.warn i { background: var(--warning); } .meter.danger i { background: var(--critical); }
.tile .flag { font-size: 11px; font-weight: 600; }
.flag.warn { color: var(--warning-ink); } .flag.danger { color: var(--critical-ink); }
.controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
#runSelect { max-width: 300px; padding: 5px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.chip.live .dot { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
.chip.live { color: var(--good-ink); }
.chip.down { color: var(--warning-ink); } .chip.down .dot { background: var(--warning); }

/* ---------- pulse strip chart ---------- */
.pulse { background: var(--surface); border-bottom: 1px solid var(--line); padding-block: 10px 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: relative; }
.pulse-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; margin-bottom: 8px; }
.pulse-head .title { font-weight: 600; }
.pulse-head .note { color: var(--muted); font-size: 12px; }
.pulse-head .grow { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 2px 9px; font-size: 12px; background: var(--surface); color: var(--ink-2); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-wash); color: var(--accent); font-weight: 600; }
/* One grid for the main strip and the per-agent strips, so every bin lines up. */
.chart { display: grid; grid-template-columns: 0 minmax(0, 1fr); column-gap: 0; row-gap: 6px; align-items: end; }
.chart.multi { grid-template-columns: minmax(84px, 150px) minmax(0, 1fr); column-gap: 12px; }
.chart .axis { grid-column: 2; }
.bars { display: grid; grid-template-columns: repeat(42, minmax(0, 1fr)); grid-template-rows: 56px; gap: 2px; align-items: stretch; border-bottom: 1px solid var(--baseline); overflow: hidden; }
.bars.small { grid-template-rows: 22px; }
.bin { min-width: 0; min-height: 0; display: flex; align-items: flex-end; justify-content: center; padding: 0; border: 0; background: none; border-radius: 0; cursor: default; position: relative; }
.bin:hover { background: none; }
.bin i { display: block; width: 100%; max-width: 24px; border-radius: 4px 4px 0 0; background: var(--series-1); min-height: 2px; }
.bin.empty i { background: var(--line); border-radius: 1px; }
.bin.has { cursor: pointer; }
.bin.has:hover i, .bin:focus-visible i { filter: brightness(1.12); }
.bin.selected i { outline: 2px solid var(--ink); outline-offset: 1px; }
.bin .err { position: absolute; bottom: 2px; left: 50%; width: 6px; height: 6px; margin-left: -3px; border-radius: 50%; background: var(--critical); box-shadow: 0 0 0 2px var(--surface); }
.axis { display: flex; justify-content: space-between; color: var(--muted); font: 10.5px var(--mono); margin-top: 2px; }
.trace-name { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); min-width: 0; }
.trace-name span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.key { width: 12px; height: 3px; border-radius: 2px; flex: none; }
.tip { position: absolute; z-index: 20; pointer-events: none; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px; box-shadow: 0 4px 14px rgba(0,0,0,.12); font-size: 12px; white-space: nowrap; }
.tip b { font-size: 14px; display: block; }
.tip .t { color: var(--muted); font: 11px var(--mono); }
.tip .e { color: var(--critical-ink); font-weight: 600; }

/* ---------- toolbar ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.filters { display: flex; flex-wrap: wrap; gap: 4px; min-width: 0; }
.filters button { display: inline-flex; gap: 6px; align-items: baseline; padding: 3px 9px; font-size: 12px; color: var(--ink-2); }
.filters button kbd { font: 10px var(--mono); color: var(--muted); }
.filters button .n { font-variant-numeric: tabular-nums; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.filters button[aria-pressed="true"] .n, .filters button[aria-pressed="true"] kbd { color: var(--accent); }
.filters button.zero { opacity: .55; }
.search { flex: 1; min-width: 180px; display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; }
.search input { flex: 1; min-width: 0; border: 0; background: none; padding: 5px 0; outline: none; }
.search:focus-within { border-color: var(--accent); }
.search kbd { font: 10px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }

/* ---------- tape ---------- */
main { flex: 1; display: flex; min-height: 0; position: relative; }
#tape { flex: 1; min-width: 0; overflow: auto; padding-block: 0 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); outline: none; }
.row { display: grid; grid-template-columns: 3px 92px 92px minmax(0, 1fr) auto; gap: 10px; align-items: center; min-height: 32px; padding: 4px 10px 4px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.row:hover { background: var(--surface-2); }
.row[aria-selected="true"] { background: var(--accent-wash); }
.row .stripe { align-self: stretch; border-radius: 2px; }
.row .ts { color: var(--muted); font: 11.5px var(--mono); font-variant-numeric: tabular-nums; }
.badge { display: inline-flex; align-items: center; gap: 5px; max-width: 100%; font-size: 11.5px; color: var(--ink-2); white-space: nowrap; overflow: hidden; }
.badge .g { width: 14px; text-align: center; color: var(--muted); flex: none; }
.badge b { font-weight: 600; color: var(--ink); overflow: hidden; text-overflow: ellipsis; }
.row .body { min-width: 0; display: flex; align-items: center; gap: 8px; }
.row .who { flex: none; font-size: 11.5px; color: var(--ink-2); max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .preview { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .preview.mono { font: 12px var(--mono); color: var(--ink-2); }
.row.role-user .preview { font-weight: 550; }
.row .meta { display: flex; gap: 8px; align-items: center; color: var(--muted); font: 11.5px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 4px; font: 600 11px var(--sans); padding: 1px 7px; border-radius: 999px; white-space: nowrap; }
.pill.error { color: var(--critical-ink); background: var(--critical-wash); }
.pill.running { color: var(--warning-ink); background: color-mix(in srgb, var(--warning) 18%, transparent); }
.pill.done { color: var(--good-ink); background: color-mix(in srgb, var(--good) 13%, transparent); }
.empty { max-width: 440px; margin: 56px auto; text-align: center; color: var(--ink-2); }
.empty b { display: block; color: var(--ink); font-size: 15px; margin-bottom: 6px; text-wrap: balance; }
.empty p { margin: 0; text-wrap: pretty; }
#follow { position: absolute; right: max(24px, env(safe-area-inset-right, 0px)); bottom: max(18px, env(safe-area-inset-bottom, 0px)); box-shadow: 0 4px 14px rgba(0,0,0,.16); background: var(--ink); color: var(--surface); border-color: var(--ink); font-weight: 600; }
#follow[hidden] { display: none; }

/* ---------- inspector ---------- */
#inspector { width: 560px; flex: none; border-left: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; min-height: 0; position: relative; }
#inspector[hidden] { display: none; }
#resizer { position: absolute; left: -4px; top: 0; bottom: 0; width: 8px; cursor: col-resize; z-index: 2; }
.insp-head { display: flex; gap: 10px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); }
.insp-head .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.insp-head h2 { font-size: 14px; margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.insp-body { overflow: auto; padding: 4px 16px 24px; flex: 1; }
.insp-body h3 { font: 600 11px var(--sans); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 18px 0 6px; }
dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 14px; margin: 0; font-size: 12px; }
dt { color: var(--muted); } dd { margin: 0; font-family: var(--mono); overflow-wrap: anywhere; }
pre { background: var(--surface-2); border-radius: 6px; padding: 8px 0; margin: 0; overflow: auto; font: 12px/1.55 var(--mono); }
pre .ln { display: grid; grid-template-columns: 44px minmax(0, 1fr); }
pre .ln::before { content: attr(data-n); color: var(--muted); text-align: right; padding-right: 12px; user-select: none; }
pre .ln span { white-space: pre-wrap; overflow-wrap: anywhere; padding-right: 10px; }
pre .ln.add { background: var(--add-wash); } pre .ln.del { background: var(--del-wash); } pre .ln.hunk { color: var(--accent); }
details summary { cursor: pointer; color: var(--ink-2); font-size: 12px; margin-top: 16px; }
.more { margin-top: 6px; }
#backdrop[hidden] { display: none; }
#backdrop { position: fixed; inset: 0; background: rgba(10,12,16,.35); z-index: 9; }

@media (max-width: 1060px) {
  #inspector { position: fixed; right: 0; top: 0; bottom: 0; width: min(560px, 94vw) !important; z-index: 10; box-shadow: -8px 0 28px rgba(0,0,0,.22); padding-top: env(safe-area-inset-top, 0px); padding-right: env(safe-area-inset-right, 0px); }
  #resizer { display: none; }
}
@media (max-width: 780px) {
  .row { grid-template-columns: 3px 88px minmax(0, 1fr) auto; }
  .row .kindcol { display: none; }
  .row .ts { font-size: 10.5px; }
  .brand { flex-basis: 100%; flex-direction: row; align-items: baseline; gap: 8px; }
  .tiles { gap: 10px 22px; }
  .tile .value { font-size: 14px; }
  .controls { flex-basis: 100%; }
  #runSelect { flex: 1; max-width: none; }
  .chart.multi { grid-template-columns: 80px minmax(0, 1fr); }
  /* One scrollable row of filters instead of three wrapped rows. */
  .filters { flex-wrap: nowrap; overflow-x: auto; flex-basis: 100%; padding-bottom: 2px; }
  .filters button { flex: none; }
}
@media (max-width: 520px) {
  .row .meta .dur, .row .who { display: none; }
  .search kbd { display: none; }
  .tiles .tile:nth-child(4) .sub { display: none; }
}
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>icers observe</b><span id="runLabel">connecting…</span></div>
  <div class="tiles">
    <div class="tile"><span class="label">Model</span><span class="value" id="mModel">–</span><span class="sub" id="mThinking">thinking –</span></div>
    <div class="tile"><span class="label">Context</span><span class="value" id="mContext">–</span><div class="meter" id="mMeter"><i style="width:0"></i></div></div>
    <div class="tile"><span class="label">Tokens</span><span class="value" id="mTokens">0</span><span class="sub" id="mTokensSub">in 0 · out 0</span></div>
    <div class="tile"><span class="label">Cost</span><span class="value" id="mCost">$0.000</span><span class="sub" id="mCache">cache 0</span></div>
    <div class="tile"><span class="label">Events</span><span class="value" id="mEvents">0</span><span class="sub" id="mErrors">no errors</span></div>
  </div>
  <div class="controls">
    <select id="runSelect" aria-label="Run"><option value="all">All live agents</option></select>
    <span class="chip" id="liveChip"><span class="dot"></span><span id="liveText">Connecting</span></span>
  </div>
</header>
<section class="pulse" aria-label="Activity pulse">
  <div class="pulse-head">
    <span class="title">Activity</span><span class="note" id="pulseNote"></span><span class="grow"></span>
    <span class="seg" id="ranges" role="group" aria-label="Time range"></span>
  </div>
  <div class="chart" id="chart">
    <div class="trace-name" id="allName"></div>
    <div class="bars" id="bars" role="group" aria-label="Activity per time bin"></div>
    <div class="axis" id="axis"></div>
  </div>
  <div class="tip" id="tip" hidden></div>
</section>
<div class="toolbar">
  <div class="filters" id="filters" role="group" aria-label="Filter by kind"></div>
  <label class="search"><input id="search" type="search" placeholder="Search text, arguments, results" aria-label="Search activity"><kbd>/</kbd></label>
  <button id="pauseBtn" type="button" aria-pressed="false" title="Space">Pause follow</button>
</div>
<main>
  <div id="tape" role="listbox" aria-label="Activity" tabindex="0"></div>
  <button id="follow" type="button" hidden>Resume follow ↓</button>
  <div id="backdrop" hidden></div>
  <aside id="inspector" aria-label="Event inspector" hidden>
    <div id="resizer" role="separator" aria-orientation="vertical" tabindex="0" aria-label="Resize inspector"></div>
    <div class="insp-head">
      <div class="t"><span class="label" id="inspKind"></span><h2 id="inspTitle"></h2></div>
      <span id="inspState"></span>
      <button id="copyBtn" type="button">Copy JSON</button>
      <button id="closeBtn" type="button" aria-label="Close inspector">✕</button>
    </div>
    <div class="insp-body" id="inspBody"></div>
  </aside>
</main>
<script>
"use strict";
(() => {
  const MAX_ROWS = 500, PULSE_BINS = 42, SEARCH_BUDGET = 20000, PREVIEW = 150, CODE_LINES = 1500;
  const FOLLOW_THRESHOLD = 36, INSPECT_THROTTLE = 500, WIDTH_KEY = "icers-observe-inspector-width";
  const RANGES = [60000, 180000, 300000, 600000];
  const FILTERS = ["all", "tool", "message", "skill", "compaction", "retry", "queue", "subagent", "memory", "goal"];
  const GLYPH = { tool: "⚙", message: "✎", skill: "★", compaction: "⇲", retry: "↻", queue: "≡", subagent: "◈", memory: "◎", goal: "◎" };
  // Recorder color names -> validated categorical slots (fixed, never cycled).
  const SLOT = { blue: 1, orange: 2, cyan: 3, amber: 4, rose: 5, green: 6, violet: 7 };
  const $ = (id) => document.getElementById(id);
  const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = String(text); return n; };

  const state = {
    items: new Map(), order: [], threads: new Map(), lanes: new Map(), runs: [], header: null,
    filter: "all", query: "", paused: false, rangeIndex: 2, selectedId: null, selectedBin: null,
    scope: "all", selectedRunId: "all", liveRunId: null, generation: 0,
  };
  const searchCache = new WeakMap();

  // ---------- formatting ----------
  const compact = (n) => { n = Number(n) || 0; if (n >= 1e6) return (n / 1e6).toFixed(1) + "M"; if (n >= 1e3) return (n / 1e3).toFixed(1) + "k"; return String(Math.round(n)); };
  const duration = (ms) => { if (ms == null || !isFinite(ms)) return ""; if (ms < 1000) return Math.round(ms) + "ms"; if (ms < 60000) return (ms / 1000).toFixed(2) + "s"; const m = Math.floor(ms / 60000); return m + "m " + Math.round((ms % 60000) / 1000) + "s"; };
  const pad = (n, w) => String(n).padStart(w, "0");
  const clock = (ts) => { const d = new Date(ts); return `${pad(d.getHours(), 2)}:${pad(d.getMinutes(), 2)}:${pad(d.getSeconds(), 2)}.${pad(d.getMilliseconds(), 3)}`; };
  const hm = (ts) => { const d = new Date(ts); return `${pad(d.getHours(), 2)}:${pad(d.getMinutes(), 2)}:${pad(d.getSeconds(), 2)}`; };
  const keyOf = (item) => (item.runId || item.mainThreadId) + ":" + item.id;
  const firstLine = (s) => { s = String(s || "").trim(); const i = s.indexOf("\n"); if (i >= 0) s = s.slice(0, i); return s.length > PREVIEW ? s.slice(0, PREVIEW) + "…" : s; };
  const tryJson = (s) => { if (typeof s !== "string") return null; try { return JSON.parse(s); } catch { return null; } };
  const oneLine = (s) => { const v = tryJson(s); return firstLine(v && typeof v === "object" ? Object.values(v).map((x) => typeof x === "string" ? x : JSON.stringify(x)).join("  ") : s); };
  const pretty = (s) => { const v = tryJson(s); return v == null ? String(s) : JSON.stringify(v, null, 2); };
  const stateLabel = { error: "✕ error", running: "● running", done: "✓ done" };
  const pill = (s) => s ? el("span", "pill " + s, stateLabel[s] || s) : document.createTextNode("");

  // ---------- data ----------
  function haystack(item) {

    state.runs = runs;
    const select = $("runSelect");
    const signature = (r) => select.value + "|" + r.map((x) => x.runId + x.status + (x.sessionName || "")).join(",");
    if (signature(runs) === runsSignature) return;
    const rebuild = () => {
      runsSignature = signature(runs);
      const current = state.selectedRunId;
      const options = [new Option("All live agents", "all")];
      for (const r of runs) {
        const name = r.sessionName || r.sessionId.slice(0, 12);
        const status = r.runId === state.liveRunId ? "this agent" : r.status === "running" ? "live" : "finished";
        options.push(new Option(`${name} · ${r.sessionId.slice(0, 8)} · ${status}`, r.runId));
      }
      if (current !== "all" && !runs.some((r) => r.runId === current)) options.push(new Option("Selected run", current));
      select.replaceChildren(...options); select.value = current;
    };
    if (document.activeElement === select) select.addEventListener("blur", rebuild, { once: true }); else rebuild();
  }
  $("runSelect").addEventListener("change", async (e) => {
    const value = e.target.value, generation = ++state.generation;
    state.scope = value === "all" ? "all" : "run"; state.selectedRunId = value;
    const url = value === "all" ? "state?view=all" : "state?runId=" + encodeURIComponent(value);
    try {
      const res = await fetch(url, { cache: "no-store", credentials: "same-origin" });
      if (!res.ok || generation !== state.generation) return;
      const snapshot = await res.json();
      if (generation === state.generation) applySnapshot(snapshot);
    } catch { /* network errors leave the current view in place */ }
  });
  fetch("runs?limit=50", { cache: "no-store", credentials: "same-origin" }).then((r) => r.ok ? r.json() : null).then((d) => { if (d && Array.isArray(d.runs)) setRuns(d.runs); }).catch(() => {});

  // ---------- live stream ----------
  const source = new EventSource("events");
  const setLive = (live) => {
    $("liveChip").className = "chip " + (live ? "live" : "down");
    $("liveText").textContent = live ? "Live" : "Reconnecting";
  };
  source.onopen = () => setLive(true);
  source.onerror = () => setLive(false);
  const on = (name, fn) => source.addEventListener(name, (e) => { try { fn(JSON.parse(e.data)); } catch { /* ignore a malformed frame */ } });
  on("snapshot", (snapshot) => {
    if (snapshot.liveRunId) state.liveRunId = snapshot.liveRunId;
    if (state.scope === "run") { if (Array.isArray(snapshot.runs)) setRuns(snapshot.runs); return; }
    applySnapshot(snapshot);
  });
  on("runs", setRuns);
  on("activity", (item) => { if (accepts(item)) scheduleRender(false, upsert(item)); });
  on("activity_update", (item) => { if (accepts(item)) scheduleRender(false, upsert(item)); });
  on("thread", (t) => { addThread(t); scheduleRender(true); });
  on("lane", (l) => { state.lanes.set((l.runId || "current") + ":" + l.streamKey, l); });
  on("header", (h) => {
    const target = state.scope === "all" ? state.liveRunId : state.selectedRunId;
    if (!target || !h.runId || h.runId === target) { state.header = Object.assign({}, state.header, h); scheduleRender(); }
  });
  scheduleRender(true);
})();
</script>
</body>
</html>
