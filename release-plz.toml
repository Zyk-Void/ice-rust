# Contributors do not bump versions. Release-plz prepares one workspace PR;
# release.yml publishes it only after a maintainer merges that PR into main.
[workspace]
release = false
release_always = false
dependencies_update = false
changelog_update = false
git_tag_enable = false
git_release_enable = false
pr_branch_prefix = "release-plz-"
pr_name = "chore(release): prepare {{ version }}"
pr_draft = true

[[package]]
name = "ice-telemetry"
release = true
version_group = "ice"

[[package]]
name = "ice-ai"
release = true
version_group = "ice"

[[package]]
name = "ice-agent"
release = true
version_group = "ice"

[[package]]
name = "ice-plugin-sdk"
release = true
version_group = "ice"

[[package]]
name = "ice-extensions"
release = true
version_group = "ice"

[[package]]
name = "ice-tools"
release = true
version_group = "ice"

[[package]]
name = "ice-harness"
release = true
version_group = "ice"

[[package]]
name = "ice-tui"
release = true
version_group = "ice"

[[package]]
name = "ice-cli"
release = true
version_group = "ice"
changelog_update = true
changelog_path = "CHANGELOG.md"
changelog_include = ["ice-telemetry", "ice-ai", "ice-agent", "ice-plugin-sdk", "ice-extensions", "ice-tools", "ice-harness", "ice-tui"]
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true
